<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>BandwithQuality 架构：React 前端 ⇄ Wails 事件桥 ⇄ Go 测速引擎 → 测速节点；结果写入 SQLite</title>
  <desc>一次测速的数据流：前端发起，Go 引擎完成选点与上下行吞吐测量，500ms 采样经事件桥实时推送回前端绘制曲线，结果写入 SQLite 本地存储。</desc>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181B22"/>
      <stop offset="100%" stop-color="#12141A"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6473"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#wbg)"/>

  <!-- 采样徽标 -->
  <g>
    <rect x="519" y="26" width="170" height="30" rx="15" fill="none" stroke="#2E3542"/>
    <circle cx="539" cy="41" r="4" fill="#008C8B"/>
    <text x="616" y="46.5" font-size="14.5" fill="#B9C2CF" text-anchor="middle">500ms 采样推送</text>
    <path d="M 604 56 V 84" stroke="#5A6473" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 三个主框 -->
  <g font-size="22" font-weight="600" fill="#F5F7FA" text-anchor="middle">
    <rect x="64" y="84" width="250" height="126" rx="14" fill="#1C2029" stroke="#2E3542" stroke-width="1.5"/>
    <text x="189" y="128">React 前端</text>
    <g font-size="16.5" font-weight="400" fill="#96A0B0">
      <text x="189" y="162">React 18 · TypeScript · Tailwind</text>
      <text x="189" y="188">仪表盘 · 曲线 · 历史对比</text>
    </g>

    <rect x="479" y="84" width="250" height="126" rx="14" fill="#1C2029" stroke="#2E3542" stroke-width="1.5"/>
    <text x="604" y="128">Go 测速引擎</text>
    <g font-size="16.5" font-weight="400" fill="#96A0B0">
      <text x="604" y="162" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="15.5" fill="#7C8598">internal/engine</text>
      <text x="604" y="188">选点 · 吞吐 · 时延 · 编排</text>
    </g>

    <rect x="894" y="84" width="250" height="126" rx="14" fill="#1C2029" stroke="#2E3542" stroke-width="1.5"/>
    <text x="1019" y="128">测速节点</text>
    <g font-size="16.5" font-weight="400" fill="#96A0B0">
      <text x="1019" y="162">分省市 · 分运营商候选</text>
      <text x="1019" y="188">自动择优 / 手动切换</text>
    </g>

    <!-- 存储 -->
    <rect x="479" y="258" width="250" height="62" rx="14" fill="#1C2029" stroke="#2E3542" stroke-width="1.5"/>
    <text x="604" y="284" font-size="18">SQLite 本地存储</text>
    <text x="604" y="306" font-size="15.5" font-weight="400" fill="#96A0B0">历史与设置 · 纯 Go 驱动</text>
  </g>

  <!-- 连线 -->
  <g stroke="#5A6473" stroke-width="2" fill="none">
    <path d="M 314 120 H 479" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <path d="M 729 120 H 894" marker-end="url(#arr)"/>
    <path d="M 604 210 V 258" marker-end="url(#arr)"/>
  </g>
  <g font-size="16.5" fill="#B9C2CF" text-anchor="middle">
    <text x="396.5" y="102">Wails 事件桥</text>
    <text x="396.5" y="150" font-size="15.5" fill="#7C8598">进程内事件推送</text>
    <text x="811.5" y="102">HTTPS / TCP</text>
    <text x="811.5" y="150" font-size="15.5" fill="#7C8598">控制面 · 数据面</text>
  </g>
  <text x="618" y="240" font-size="15.5" fill="#7C8598">结果入库</text>
</svg>
