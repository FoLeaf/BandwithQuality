  <title>BandwithQuality — 高性能、简洁的网络带宽测试工具</title>
  <desc>左侧为项目名与定位；右侧为应用内速度仪表盘的静态复刻：非线性档位刻度环、锋利刻度、进度弧与 672.8 Mbps 实时读数。</desc>
