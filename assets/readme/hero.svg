    <text x="70" y="172" font-size="60" font-weight="800" letter-spacing="-1" fill="#F5F7FA">BandwithQuality</text>
    <text x="72" y="226" font-size="26" font-weight="500" fill="#DDE3EA">高性能、简洁的网络带宽测试工具</text>
    <text x="72" y="266" font-size="15.5" fill="#96A0B0">免安装单文件 · 真实大陆节点 · 实时速率曲线 · IPv4 / IPv6 双栈 · 本地历史</text>
